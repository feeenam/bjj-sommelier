name: Supabase Keepalive

on:
  schedule:
    - cron: '13 9 */3 * *'  # every 3 days, well under Supabase's 7-day pause window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/videos?limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
